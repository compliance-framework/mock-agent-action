name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # A final vX.Y.Z release moves the v<X> tag to the release commit; a release candidate moves nothing.
  release:
    uses: compliance-framework/workflows/.github/workflows/release-action.yml@d72b127a668e93d3eb503f775fb4c2bbb0bfdef9 # v1.2.0
    permissions:
      contents: write
      packages: write
    secrets: inherit
