name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # A final vX.Y.Z release moves the v<X> tag to the release commit; a release candidate moves nothing.
  release:
    uses: compliance-framework/workflows/.github/workflows/release-action.yml@21aaac7c174aaf90abafecf1c90c30b238367d3d # v1.3.1
    permissions:
      contents: write
      packages: write
    secrets: inherit
