name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # A final vX.Y.Z release moves the v<X> tag to the release commit; a release candidate moves nothing.
  release:
    uses: compliance-framework/workflows/.github/workflows/release-action.yml@0820491954d2f748fed5601109a8b6e422deee69 # v1.1.0
    permissions:
      contents: write
      packages: write
    secrets: inherit
