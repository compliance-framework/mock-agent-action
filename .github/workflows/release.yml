name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # A final vX.Y.Z release moves the v<X> tag to the release commit; a release candidate moves nothing.
  release:
    uses: compliance-framework/workflows/.github/workflows/release-action.yml@55c549bf712163152173b398e297fba0f907ceca # v1.4.0
    permissions:
      contents: write
      packages: write
    secrets: inherit
