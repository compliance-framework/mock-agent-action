name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # A final vX.Y.Z release moves the v<X> tag to the release commit; a release candidate moves nothing.
  release:
    uses: compliance-framework/workflows/.github/workflows/release-action.yml@ec58cea2c02f12b5dad6b23a7bfdc84360f59f11 # v1.3.0
    permissions:
      contents: write
      packages: write
    secrets: inherit
