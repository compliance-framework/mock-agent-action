name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # A final vX.Y.Z release moves the v<X> tag to the release commit; a release candidate moves nothing.
  release:
    uses: compliance-framework/workflows/.github/workflows/release-action.yml@7b55019ed36050a57eb8273f6a67fd4b2395adb0 # v1.5.1
    permissions:
      contents: write
      packages: write
    secrets: inherit
